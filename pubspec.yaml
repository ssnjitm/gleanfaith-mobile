name: glean_faith_app
description: "Bible Quiz App with leaderboard, audio, blogs, PDF, videos, articles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Functional Programming
  fpdart: ^1.1.1

  # Routing
  go_router: ^14.8.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Logging
  talker: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.1.17

  # Storage
  flutter_secure_storage: ^10.3.1
  objectbox: ^4.1.0
  objectbox_flutter_libs: ^4.1.0
  path_provider: ^2.1.6

  # Utilities
  equatable: ^2.0.7
  intl: ^0.19.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  sqflite: ^2.4.2+1
  path: ^1.9.1
  video_player: ^2.11.1
  chewie: ^1.14.1
  just_audio: ^0.10.6
  pdfx: ^2.9.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  objectbox_generator: ^4.1.0

flutter:
  uses-material-design: true
  
  # ============================================================
  # ASSETS - Add your database and other assets here
  # ============================================================
  assets:
    # Bible Database
    - assets/databases/topical_bible.db
    - assets/databases/bible_crossword_50_sets.json
    
    # Other assets (uncomment as you add them)
    # - assets/images/
    # - assets/icons/
    # - assets/fonts/
    # - assets/lottie/
    # - assets/audio/
    # - assets/videos/